# Pin software metadata on dev after stable GitHub/npm publication.
# Verify the immutable tag and public stable release; images are independent.
# Software mode writes only channel manifests and the plugin market index.
# Image-only mode verifies the image and changes only Helm image selection.
name: Pin Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact minted candidate version without the v prefix'
        required: true
        type: string
      image_only:
        description: 'Pin only the verified on-demand image in Helm; leave software pins alone'
        type: boolean
        default: false
  # release-candidate.yml calls the pin in-run after its mint succeeds (#1142).
  workflow_call:
    inputs:
      version:
        description: 'Exact minted candidate version without the v prefix'
        required: true
        type: string
      image_only:
        description: 'Pin only the verified on-demand image in Helm; leave software pins alone'
        type: boolean
        default: false
    secrets:
      VERSION_BUMP_PAT:
        required: true

concurrency:
  group: version-dev
  cancel-in-progress: false

permissions: {}

jobs:
  pin:
    name: Pin software or image metadata on dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
    steps:
      - name: Require protected version writer credential
        env:
          VERSION_WRITER_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          [[ -n "${VERSION_WRITER_TOKEN}" ]] || {
            echo "::error::VERSION_BUMP_PAT is required so the pin push to dev triggers its CI"
            exit 1
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the minted candidate from public state
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ONLY: ${{ inputs.image_only }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::version must be a canonical numeric dotted version without the v prefix"
            exit 1
          }
          tree_version=$(jq -r .version packages/cli/package.json)
          if [[ "${IMAGE_ONLY}" != "true" && "${tree_version}" != "${VERSION}" ]]; then
            echo "::error::dev is at ${tree_version}, past candidate ${VERSION}; that software candidate can no longer be promoted. Cut and publish a fresh candidate"
            exit 1
          fi
          candidate_sha=$(git rev-parse "refs/tags/v${VERSION}^{commit}" 2>/dev/null) || {
            echo "::error::no immutable tag v${VERSION}; cut it with version.yml candidate=true and publish it with release-stable.yml first"
            exit 1
          }
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]
          scripts/release/verify-remote-tag.sh \
            --remote origin --version "${VERSION}" --mode exact --expected-sha "${candidate_sha}"
          git merge-base --is-ancestor "${candidate_sha}" HEAD || {
            echo "::error::v${VERSION} (${candidate_sha}) is not on dev"
            exit 1
          }

          if [[ "${IMAGE_ONLY}" != "true" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" > "${RUNNER_TEMP}/release.json"
            [[ "$(jq -r '[.draft,.prerelease] | @tsv' "${RUNNER_TEMP}/release.json")" == $'false\tfalse' ]] || {
              echo "::error::release v${VERSION} is not public stable; the mint did not finish"
              exit 1
            }
            published_at=$(jq -r .published_at "${RUNNER_TEMP}/release.json")
            [[ "${published_at}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
              echo "::error::stable release v${VERSION} has no published_at timestamp"
              exit 1
            }
          else
            published_at=""
          fi
          {
            echo "sha=${candidate_sha}"
            echo "published_at=${published_at}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx for the image-only pin
        if: inputs.image_only == true
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify and pin the on-demand image in Helm
        if: inputs.image_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:v${VERSION}" --format '{{.Manifest.Digest}}')
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          gh attestation verify "oci://${IMAGE}@${digest}" \
            --repo "${GITHUB_REPOSITORY}" --source-digest "${SOURCE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-build.yml"
          python3 - "${VERSION}" "${IMAGE}" <<'PY_IMAGE'
          import re, sys
          from pathlib import Path
          path = Path("deploy/helm/omni/values.yaml")
          text, count = re.subn(r'^  tag: "v[0-9]+\.[0-9]+\.[0-9]+"$', f'  tag: "v{sys.argv[1]}"', path.read_text(), flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("expected exactly one Helm image.tag")
          text, count = re.subn(r'^  repository: \S+$', f'  repository: {sys.argv[2]}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("expected a Helm image.repository")
          path.write_text(text)
          PY_IMAGE

      - name: Write the public channel pins
        if: inputs.image_only != true
        env:
          PUBLISHED_AT: ${{ steps.candidate.outputs.published_at }}
        run: |
          set -euo pipefail
          python3 - "${VERSION}" "${PUBLISHED_AT}" "${GITHUB_REPOSITORY}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, published_at, repository = sys.argv[1:4]

          def replace_once(text: str, pattern: str, replacement: str, path: str) -> str:
              text, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {pattern!r}, found {count}")
              return text

          for name in ("latest", "dev"):
              path = Path(f".well-known/{name}.json")
              text = path.read_text(encoding="utf-8")
              text = replace_once(text, r'^(\s*"version":\s*")[^"]*(")', rf"\g<1>{version}\g<2>", str(path))
              text = replace_once(text, r'^(\s*"released_at":\s*")[^"]*(")', rf"\g<1>{published_at}\g<2>", str(path))
              text = replace_once(
                  text,
                  r'^(\s*"tarball_base":\s*")[^"]*(")',
                  rf"\g<1>https://github.com/{repository}/releases/download/v{version}\g<2>",
                  str(path),
              )
              path.write_text(text, encoding="utf-8")

          PY
          git diff --stat

      - if: inputs.image_only != true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # The market index lists Omni's own plugins at the version their package.json
      # files carry at the tag (the Omni release of each one's last change), so it
      # never trails Omni; an unchanged plugin keeps its listed entry.
      - name: List the candidate's plugins in the market index
        if: inputs.image_only != true
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/marketplace.ts pin "v${VERSION}"
          bun scripts/marketplace.ts check
          git diff --stat marketplace/automagik.json

      - name: Commit and push the pin to dev
        env:
          VERSION_WRITER_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          IMAGE_ONLY: ${{ inputs.image_only }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${IMAGE_ONLY}" == "true" ]]; then
            git add deploy/helm/omni/values.yaml
          else
            git add .well-known/latest.json .well-known/dev.json marketplace/automagik.json
          fi
          if git diff --cached --quiet; then
            echo "dev already pins candidate v${VERSION}; nothing to commit"
            exit 0
          fi
          if [[ "${IMAGE_ONLY}" == "true" ]]; then
            git commit -m "chore(release): pin image v${VERSION}"
          else
            git commit -m "chore(release): pin candidate v${VERSION}"
          fi
          # Machine-account push (not github-actions[bot]) so the pin commit's
          # CI runs and any open promotion PR is not held at action_required;
          # same rationale and credential as version.yml's bump push.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${VERSION_WRITER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/dev"
          {
            echo "### Pinned Omni release candidate v${VERSION} on dev"
            echo "- source: \`${CANDIDATE_SHA}\`"
            echo "- next: open (or refresh) the dev → main promotion PR"
          } >> "${GITHUB_STEP_SUMMARY}"
