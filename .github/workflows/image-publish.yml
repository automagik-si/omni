# Read-only main promotion: verify the immutable software tag, signed release
# assets and npm publication. An image is optional and never required here.
name: Verify Production Promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-promotion-read-only
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read

jobs:
  verify-promotion:
    name: Verify immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Derive the candidate from the main tree
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::production promotion verification is restricted to main"
            exit 1
          }
          candidate_version=$(jq -r .version packages/cli/package.json)
          [[ "${candidate_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::packages/cli/package.json version '${candidate_version}' is not a canonical dotted version"
            exit 1
          }
          candidate_sha=$(git rev-parse "refs/tags/v${candidate_version}^{commit}" 2>/dev/null) || {
            echo "::error::no immutable tag v${candidate_version}: main carries a version that was never cut as a candidate (cut it with version.yml candidate=true, then publish it with release-stable.yml at refs/tags/v<version>)"
            exit 1
          }
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq -r .version .well-known/latest.json)" == "${candidate_version}" ]] || {
            echo "::error::.well-known/latest.json is not pinned to ${candidate_version}; pin-candidate.yml did not land on dev before this promotion"
            exit 1
          }
          {
            echo "CANDIDATE_VERSION=${candidate_version}"
            echo "CANDIDATE_SHA=${candidate_sha}"
          } >> "${GITHUB_ENV}"

      - name: Checkout immutable candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: release-candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind final main tree to the immutable candidate
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "${FINAL_SHA}" ]]
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse 'origin/main^{commit}')" == "${FINAL_SHA}" ]] || {
            echo "::error::checked-out final SHA is not the authoritative main tip"
            exit 1
          }
          scripts/release/verify-promotion-candidate.sh \
            --candidate-sha "${CANDIDATE_SHA}" \
            --final-sha "${FINAL_SHA}" \
            --version "${CANDIDATE_VERSION}"

      - name: Install cosign for read-only release verification
        id: cosign-install
        # github.com/releases flakes (403/504) must not block releases (#1140).
        continue-on-error: true
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Retry install cosign for read-only release verification
        if: steps.cosign-install.outcome == 'failure'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify existing public release without republishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release/verify-remote-tag.sh \
            --remote origin \
            --version "${CANDIDATE_VERSION}" \
            --mode exact \
            --expected-sha "${CANDIDATE_SHA}"

          tag="v${CANDIDATE_VERSION}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > "${RUNNER_TEMP}/release.json"
          python3 - "${RUNNER_TEMP}/release.json" "${tag}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              release = json.load(handle)
          if release.get("tag_name") != sys.argv[2]:
              raise SystemExit("public release tag does not match the candidate")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("candidate release is not public stable")
          PY

          release_dir="${RUNNER_TEMP}/existing-release"
          mkdir -p "${release_dir}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${release_dir}"
          scripts/release/verify-release-assets.py \
            --version "${CANDIDATE_VERSION}" \
            --release-json "${RUNNER_TEMP}/release.json" \
            --dist "${release_dir}"
          for tarball in "${release_dir}"/*.tar.gz; do
            cosign verify-blob \
              --bundle "${tarball}.bundle" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml@refs/tags/v${CANDIDATE_VERSION}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${tarball}"
            # Offline: the shipped Sigstore bundle must bind this tarball's
            # digest to the candidate source and the signing workflow.
            gh attestation verify "${tarball}" \
              --bundle "${tarball}.provenance.json" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${CANDIDATE_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml"
            # Online: the same attestation must be registered in the
            # GitHub Attestations API under the candidate identity.
            gh attestation verify "${tarball}" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${CANDIDATE_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml"
          done

      - name: Verify stable npm state without publishing or moving latest
        run: |
          set -euo pipefail
          published="$(npm view "@automagik/omni@${CANDIDATE_VERSION}" version)"
          latest="$(npm view @automagik/omni dist-tags --json | jq -r '.latest // empty')"
          state="$(scripts/release/verify-npm-stable-state.sh \
            --expected "${CANDIDATE_VERSION}" \
            --published "${published}" \
            --latest "${latest}")"
          [[ "${state}" == "npm_action=none" ]] || {
            echo "::error::stable npm state is not already exact; read-only promotion refuses repair"
            exit 1
          }

      - name: Write read-only promotion receipt
        run: |
          {
            echo "### Verified Omni public-launch candidate"
            echo "- source: \`${CANDIDATE_SHA}\`"
            echo "- version: \`${CANDIDATE_VERSION}\`"
            echo "- final main tree: \`${GITHUB_SHA}\`"
            echo "- result: immutable software artifacts and source inputs verified"
            echo "- mutation boundary: no build, tag, release, alias, repository, or cluster write"
          } >> "${GITHUB_STEP_SUMMARY}"
