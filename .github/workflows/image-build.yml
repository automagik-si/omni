# Build one immutable version image intentionally. Software releases and pins
# run independently through release-candidate.yml and release-stable.yml.
# Native platform jobs push digests; merge creates the single version alias.
# Existing aliases are refused. No cache, Git refs, npm, releases or cluster writes.
name: Build release image on demand

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (v<version>); empty selects the newest stable candidate'
        required: false
        default: ''
        type: string

concurrency:
  # One lane per candidate version so two mints can never race the same
  # v<version> alias or stable release state. A started mint must finish.
  group: image-build-${{ inputs.version || 'latest-candidate' }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve the requested candidate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve version and exact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || exit 1
          newest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          tag="${REQUESTED_VERSION:-${newest}}"
          [[ "${GITHUB_REF}" == "refs/tags/${tag}" ]] || {
            echo "::error::Start this workflow at a tag: choose ${newest} in 'Use workflow from' (newest candidate), or the exact requested tag."
            exit 1
          }
          version="${tag#v}"
          [[ "${tag}" == "v${version}" ]] || exit 1
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
          [[ "${sha}" =~ ^[0-9a-f]{40}$ && "${sha}" == "${GITHUB_SHA}" ]] || exit 1
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/image-build.yml?ref=${tag}" --jq .content | base64 --decode)
          grep -qx 'name: Build release image on demand' <<<"${workflow}" || {
            echo "::error::${tag} predates the image-only workflow; select a candidate cut after on-demand images were adopted."
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build-push:
    needs: resolve
    name: Build omni-api (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
    steps:
      # A tag that already carries a public dev prerelease (a merged-PR bump,
      # or a dispatch without candidate=true) can never become stable: its
      # channel classification is immutable. Refusing here preserves the
      # existing candidate-only image identity before a costly native build.
      - name: Refuse a tag that already carries a dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          lookup_status=$(curl -sS -o "${RUNNER_TEMP}/release.json" -w '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")
          case "${lookup_status}" in
            404) echo "no release at v${VERSION} yet; the tag is mintable" ;;
            200)
              release_state=$(jq -r '[.draft,.prerelease] | @tsv' "${RUNNER_TEMP}/release.json")
              [[ "${release_state}" != $'false\ttrue' ]] || {
                echo "::error::a dev prerelease already exists at v${VERSION}; this tag cannot become stable — cut a fresh candidate with \`gh workflow run version.yml --ref dev -f candidate=true\` and mint that tag instead"
                exit 1
              }
              ;;
            *)
              echo "::error::release lookup for v${VERSION} returned HTTP ${lookup_status}; refusing to guess"
              exit 1
              ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Each platform builds natively without cache imports or exports. The PR
      # guard exercises the same build inputs without publishing. Digest pushes,
      # the merged index and its attestation still need a real candidate run.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # verify-oci-release.sh is the same preflight the read-only promotion
      # runs: it binds HEAD and the immutable tag to the expected SHA, checks
      # packages/cli/package.json and Chart.yaml appVersion against the
      # version, and inspects the registry alias. Without an
      # --expected-existing-digest it fails closed the moment
      # ghcr.io/<owner>/omni-api:v<version> already exists, so the only
      # success path is publish_required=true — a candidate is minted once and
      # never rebuilt under the same version.
      - name: Bind source identity and refuse an existing candidate alias
        id: source
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse "HEAD^{commit}")
          [[ "${source_sha}" == "${EXPECTED_SHA}" ]] || {
            echo "::error::checked-out source ${source_sha} is not the selected ${EXPECTED_SHA}"
            exit 1
          }
          scripts/release/verify-remote-tag.sh \
            --remote origin --version "${VERSION}" --mode exact --expected-sha "${source_sha}"
          preflight="${RUNNER_TEMP}/release-preflight.out"
          GITHUB_OUTPUT="${preflight}" scripts/release/verify-oci-release.sh \
            --source-dir "${GITHUB_WORKSPACE}" \
            --ref "refs/tags/v${VERSION}" \
            --expected-version "${VERSION}" \
            --expected-sha "${source_sha}" \
            --image "${IMAGE}"
          grep -qx 'publish_required=true' "${preflight}" || {
            echo "::error::${IMAGE}:v${VERSION} is already published; a candidate version is minted exactly once"
            exit 1
          }
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Platform jobs publish no tags. Only merge creates the version alias.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No BuildKit cache import or export. An immutable candidate is built
          # from its source alone: the GHA cache is mutable and shared with
          # whatever else writes the scope (any branch's build, an earlier
          # candidate), and layers pulled from it would shape the published
          # image without appearing in the attested source. A cold two-platform
          # build is the price of that.
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${ARCH}"

      - name: Upload platform digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and attest omni-api candidate
    needs: [resolve, build-push]
    concurrency:
      group: image-build-version-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      version: ${{ needs.resolve.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download platform digests from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Bind source identity and refuse an existing candidate alias
        id: source
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse "HEAD^{commit}")
          [[ "${source_sha}" == "${EXPECTED_SHA}" ]] || {
            echo "::error::checked-out source ${source_sha} is not the selected ${EXPECTED_SHA}"
            exit 1
          }
          scripts/release/verify-remote-tag.sh \
            --remote origin --version "${VERSION}" --mode exact --expected-sha "${source_sha}"
          preflight="${RUNNER_TEMP}/release-preflight.out"
          GITHUB_OUTPUT="${preflight}" scripts/release/verify-oci-release.sh \
            --source-dir "${GITHUB_WORKSPACE}" \
            --ref "refs/tags/v${VERSION}" \
            --expected-version "${VERSION}" \
            --expected-sha "${source_sha}" \
            --image "${IMAGE}"
          grep -qx 'publish_required=true' "${preflight}" || {
            echo "::error::${IMAGE}:v${VERSION} is already published; a candidate version is minted exactly once"
            exit 1
          }
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Create the immutable version index
        id: merge
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            digest=$(cat "${RUNNER_TEMP}/digests/${arch}")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            refs+=("${IMAGE}@${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:v${VERSION}" \
            --metadata-file "${RUNNER_TEMP}/merge-metadata.json" "${refs[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' "${RUNNER_TEMP}/merge-metadata.json")
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Read back exact published version alias
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          scripts/release/verify-oci-alias.sh \
            --image "${IMAGE}" --version "${VERSION}" --expected-digest "${EXPECTED_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  finalize:
    name: Verify the on-demand image
    needs: [resolve, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: read
      attestations: read
      actions: write # dispatch only the image pin
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
      DIGEST: ${{ needs.merge.outputs.digest }}
      VERSION: ${{ needs.merge.outputs.version }}
      SOURCE_SHA: ${{ needs.merge.outputs.source_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Log in to GHCR for independent verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx for independent index inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify exact digest, platforms, and GitHub provenance
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" == "${EXPECTED_SHA}" ]] || exit 1
          scripts/release/verify-remote-tag.sh \
            --remote origin --version "${VERSION}" --mode exact --expected-sha "${SOURCE_SHA}"
          scripts/release/verify-oci-alias.sh \
            --image "${IMAGE}" --version "${VERSION}" --expected-digest "${DIGEST}"
          # --raw returns the index exactly as the registry stores it; the
          # default rendering is human-oriented and not a stable contract.
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > "${RUNNER_TEMP}/image-index.json"
          python3 - "${RUNNER_TEMP}/image-index.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              index = json.load(handle)
          if not isinstance(index, dict):
              raise SystemExit("verified artifact is not a JSON object")
          media_type = index.get("mediaType")
          if media_type != "application/vnd.oci.image.index.v1+json":
              raise SystemExit(f"verified artifact is not an OCI image index: {media_type!r}")
          platforms = set()
          for manifest in index.get("manifests", []):
              platform = manifest.get("platform") if isinstance(manifest, dict) else None
              if isinstance(platform, dict):
                  platforms.add(f"{platform.get('os')}/{platform.get('architecture')}")
          missing = sorted({"linux/amd64", "linux/arm64"} - platforms)
          if missing:
              raise SystemExit(f"verified OCI index is missing platforms: {missing}")
          PY
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${SOURCE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-build.yml"

      - name: Write image receipt
        run: |
          {
            echo "### On-demand image v${VERSION}"
            echo "- source: \`${SOURCE_SHA}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- image: \`${IMAGE}:v${VERSION}\`"
            echo "- software publication and cluster state were not changed"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Pin the verified on-demand image in Helm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pin-candidate.yml --repo "${GITHUB_REPOSITORY}" --ref dev \
            --field version="${VERSION}" --field image_only=true
