name: Native image build check

on:
  pull_request:
    paths:
      - .github/workflows/image-build.yml
      - deploy/Dockerfile
      - .github/workflows/image-native-check.yml

permissions: {}

concurrency:
  group: image-native-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Native image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Keep compilation inputs identical to image-build.yml; the release
      # contract tests enforce parity. Only publication, provenance and labels
      # differ: this untrusted PR build writes a local archive and nothing else.
      - name: Build native image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
          provenance: false
          sbom: false
