# Automatic chain: bump -> candidate tag -> stable GitHub release -> software
# pins on dev and stable npm. Images are dispatched intentionally, never here.
# Failed publication resumes the same tag-bound release-stable.yml run.
name: Release Candidate

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (startsWith(github.event.head_commit.message, 'chore(version): bump to ') && github.event.head_commit.author.email == 'github-actions[bot]@users.noreply.github.com')) && 'release-candidate' || format('release-candidate-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

permissions: {}

jobs:
  cut:
    name: Cut candidate tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.head_commit.message, 'chore(version): bump to ') &&
       github.event.head_commit.author.email == 'github-actions[bot]@users.noreply.github.com')
    uses: ./.github/workflows/version.yml
    # Candidate cuts only bump and tag; software publication follows below.
    permissions:
      contents: write
      id-token: write
      actions: write
    with:
      candidate: true
    secrets:
      VERSION_BUMP_PAT: ${{ secrets.VERSION_BUMP_PAT }}

  mint:
    name: Publish candidate software
    needs: cut
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ needs.cut.outputs.version }}
      stable_released: ${{ steps.release.outputs.stable_released }}
    steps:
      - name: Dispatch release-stable.yml at the candidate tag and watch it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tag="v${VERSION}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
          [[ "${tag_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          existing=$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow release-stable.yml --branch "${tag}" --event workflow_dispatch \
            --limit 50 --json databaseId,headSha,status,conclusion \
            | jq -c --arg sha "${tag_sha}" '[.[] | select(.headSha == $sha)][0] // empty')
          run_id=$(jq -r '.databaseId // empty' <<<"${existing}")
          if [[ -n "${run_id}" ]]; then
            [[ "${run_id}" =~ ^[0-9]+$ ]] || exit 1
            state=$(jq -r '"\(.status)/\(.conclusion)"' <<<"${existing}")
            case "${state}" in
              completed/success) exit 0 ;;
              completed/*) gh run rerun "${run_id}" --repo "${GITHUB_REPOSITORY}" --failed && sleep 15 ;;
            esac
          else
            before=$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow release-stable.yml --branch "${tag}" --event workflow_dispatch \
              --limit 50 --json databaseId)
            gh workflow run release-stable.yml --repo "${GITHUB_REPOSITORY}" \
              --ref "refs/tags/${tag}" --field version="${VERSION}"
            run_id=""
            for _ in $(seq 1 30); do
              after=$(gh run list --repo "${GITHUB_REPOSITORY}" \
                --workflow release-stable.yml --branch "${tag}" --event workflow_dispatch \
                --limit 50 --json databaseId,headSha)
              run_id=$(jq -r --argjson before "${before}" --arg sha "${tag_sha}" \
                '[.[] | select(.headSha == $sha) | .databaseId] - [$before[] | .databaseId] | map(tostring) | join(" ")' <<<"${after}")
              [[ -z "${run_id}" ]] || break
              sleep 10
            done
            [[ "${run_id}" =~ ^[0-9]+$ ]] || {
              echo "::error::could not resolve exactly one new release-stable.yml run for ${tag}"
              exit 1
            }
          fi
          echo "Software release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "${GITHUB_STEP_SUMMARY}"
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status

      # The software pin follows a stable release, regardless of npm's outcome.
      # It verifies tag/release without an image. Cancelled runs pin nothing;
      # a mint that never released reports false.
      - name: Check whether the stable release exists at the tag
        id: release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '[.draft,.prerelease] | @tsv' 2>/dev/null || true)
          if [[ "${state}" == $'false\tfalse' ]]; then
            echo "stable_released=true" >> "$GITHUB_OUTPUT"
            echo "public stable release v${VERSION} exists; the pin runs"
          else
            echo "stable_released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no public stable release at v${VERSION} (state: '${state}'); the pin is skipped"
          fi

  pin:
    name: Pin candidate on dev
    needs: mint
    # A failed npm publication still permits the pin once the release exists.
    if: ${{ !cancelled() && needs.mint.outputs.stable_released == 'true' }}
    uses: ./.github/workflows/pin-candidate.yml
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      version: ${{ needs.mint.outputs.version }}
    secrets:
      VERSION_BUMP_PAT: ${{ secrets.VERSION_BUMP_PAT }}
